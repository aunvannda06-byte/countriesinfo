<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>World Countries Database</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 1400px;
      margin: auto;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
    }

    .logo span {
      color: #2563eb;
    }

    .search-box {
      width: 360px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: #2563eb;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1400px;
      margin: auto;
      padding: 30px 24px;
    }

    .page-title {
      margin-bottom: 24px;
    }

    .page-title h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #6b7280;
      font-size: 14px;
    }

    /* =========================
       COUNTRY GRID
    ========================= */

    .countries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .country-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .country-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .flag-container {
      height: 150px;
      background: #eef2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .flag-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .country-content {
      padding: 18px;
    }

    .country-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .country-meta {
      display: grid;
      gap: 7px;
      font-size: 13px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .meta-label {
      color: #6b7280;
    }

    .meta-value {
      font-weight: 600;
      text-align: right;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      position: relative;
    }

    .modal-header {
      padding: 24px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 24px;
    }

    .close-btn {
      border: none;
      background: #f3f4f6;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .detail-hero {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 30px;
      padding: 25px;
    }

    .detail-flag {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .detail-name {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .official-name {
      color: #6b7280;
      margin-bottom: 20px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 0 25px 25px;
    }

    .detail-item {
      background: #f8fafc;
      border-radius: 10px;
      padding: 15px;
    }

    .detail-item strong {
      display: block;
      color: #6b7280;
      font-size: 12px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .detail-item span {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }

    /* =========================
       STATES
    ========================= */

    .loading,
    .error,
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    .error {
      color: #dc2626;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

      .header-inner {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        width: 100%;
      }

      .detail-hero {
        grid-template-columns: 1fr;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      .page-title h1 {
        font-size: 24px;
      }
    }

    /* =========================
       DETAIL SECTIONS
    ========================= */

    .section-title {
      padding: 6px 25px 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #2563eb;
    }

    .flag-caption {
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
      line-height: 1.5;
    }

    .hero-line {
      color: #374151;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .detail-item a {
      color: #2563eb;
      text-decoration: none;
    }

    .detail-item a:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>
    <div class="header-inner">

      <div class="logo">
        World<span>Countries</span>
      </div>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search country..."
        />
      </div>

    </div>
  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <div class="page-title">
      <h1>Countries of the World</h1>
      <p id="countryCount">Loading countries...</p>
    </div>

    <div id="countriesContainer" class="countries-grid">
      <div class="loading">
        Loading country data...
      </div>
    </div>

  </main>


  <!-- =========================
       COUNTRY DETAIL MODAL
  ========================= -->

  <div id="countryModal" class="modal">

    <div class="modal-content">

      <div class="modal-header">

        <h2>Country Information</h2>

        <button
          class="close-btn"
          onclick="closeModal()"
        >
          ×
        </button>

      </div>

      <div id="countryDetails"></div>

    </div>

  </div>


  <script>

    /*
      ==========================================
      REST COUNTRIES API V5
      ==========================================

      Replace YOUR_API_KEY with your REST Countries
      API key.

      Current API:
      https://api.restcountries.com/countries/v5

      Authentication:
      Authorization: Bearer YOUR_API_KEY
    */

    // The API key now lives on the server (server.py / Netlify Function),
    // not in this page. The page only talks to its own /api/countries.
    const API_BASE = "/api/countries";

    // Free plan allows at most 100 records per request,
    // so we page through the results with offset.
    const PAGE_SIZE = 100;

    // Cache for 24h so every page refresh does not use up
    // your monthly request quota (free plan = 1,000 requests).
    const CACHE_KEY = "worldcountries_cache_v1";
    const CACHE_TTL = 24 * 60 * 60 * 1000;


    let countries = [];
    let visibleList = [];


    /* ==========================================
       FETCH ONE PAGE
    ========================================== */

    async function fetchPage(offset) {

      const url =
        `${API_BASE}?limit=${PAGE_SIZE}&offset=${offset}` +
        `&response_fields_omit=names.translations`;

      let response;

      try {

        response = await fetch(url);

      } catch (networkError) {

        throw new Error(
          location.protocol === "file:"
            ? "Open this page through the server (python server.py, then http://localhost:8000), not by double-clicking the file."
            : "Cannot reach the server. Is it running?"
        );

      }

      let body = null;

      try {
        body = await response.json();
      } catch (e) {}

      if (!response.ok) {
        throw new Error(
          body?.errors?.[0]?.message ||
          `Request failed (HTTP ${response.status})`
        );
      }

      return body.data;

    }


    /* ==========================================
       FETCH ALL COUNTRIES (with pagination + cache)
    ========================================== */

    async function fetchAllCountries() {

      try {

        const cached =
          JSON.parse(localStorage.getItem(CACHE_KEY) || "null");

        if (
          cached &&
          Date.now() - cached.time < CACHE_TTL &&
          cached.items?.length
        ) {
          return cached.items;
        }

      } catch (e) {}


      let all = [];
      let offset = 0;
      let more = true;

      while (more) {

        const data = await fetchPage(offset);
        const items = data?.objects || [];

        all = all.concat(items);

        more = Boolean(data?.meta?.more) && items.length > 0;
        offset += PAGE_SIZE;

      }


      try {
        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify({ time: Date.now(), items: all })
        );
      } catch (e) {}

      return all;

    }


    /* ==========================================
       LOAD COUNTRIES
    ========================================== */

    async function loadCountries() {

      const container =
        document.getElementById("countriesContainer");

      try {

        countries = await fetchAllCountries();

        document.getElementById(
          "countryCount"
        ).textContent =
          `${countries.length} countries available`;

        renderCountries(countries);

      } catch (error) {

        console.error(error);

        document.getElementById(
          "countryCount"
        ).textContent = "";

        container.innerHTML = `
          <div class="error">
            <h3>Unable to load countries</h3>
            <p>${error.message}</p>
          </div>
        `;

      }

    }


    /* ==========================================
       SMALL HELPERS
    ========================================== */

    function esc(value) {

      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));

    }

    function isEmpty(value) {

      return (
        value === null ||
        value === undefined ||
        (typeof value === "string" &&
          (value.trim() === "" || value.trim() === "—")) ||
        (Array.isArray(value) && value.length === 0)
      );

    }

    function cap(text) {

      return text
        ? text.charAt(0).toUpperCase() + text.slice(1)
        : "";

    }

    function formatNumber(number) {

      return typeof number === "number"
        ? number.toLocaleString()
        : "";

    }

    function unique(array) {

      return [...new Set(array.filter(Boolean))];

    }

    const MONTHS = [
      "January", "February", "March", "April",
      "May", "June", "July", "August",
      "September", "October", "November", "December"
    ];

    function monthDay(month, day) {

      if (!month || !day || !MONTHS[month - 1]) {
        return "";
      }

      return `${MONTHS[month - 1]} ${day}`;

    }

    /* One info box. Returns "" when there is no data. */

    function item(label, value) {

      if (isEmpty(value)) {
        return "";
      }

      return `
        <div class="detail-item">
          <strong>${label}</strong>
          <span>${value}</span>
        </div>
      `;

    }

    /* One titled section. Returns "" when every box is empty. */

    function section(title, items) {

      const rows = items.filter(Boolean).join("");

      if (!rows) {
        return "";
      }

      return `
        <h3 class="section-title">${title}</h3>
        <div class="details-grid">${rows}</div>
      `;

    }

    function link(url, text) {

      return /^https?:\/\//i.test(url || "")
        ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${text}</a>`
        : "";

    }


    /* ==========================================
       RENDER COUNTRY CARDS
    ========================================== */

    function renderCountries(list) {

      visibleList = list;

      const container =
        document.getElementById("countriesContainer");

      if (!list.length) {

        container.innerHTML = `
          <div class="empty">
            No countries found.
          </div>
        `;

        return;
      }

      container.innerHTML =
        list.map((country, index) => {

          const name =
            country.names?.common || "Unknown";

          const flag =
            country.flag?.url_png ||
            country.flag?.url_svg ||
            "";

          const capital =
            (country.capitals || [])
              .map(c => c.name)
              .filter(Boolean)[0] || "";

          const rows = [
            ["ISO", country.codes?.alpha_2],
            ["Capital", capital],
            ["Region", country.region]
          ]
            .filter(([, value]) => !isEmpty(value))
            .map(([label, value]) => `
              <div class="meta-row">
                <span class="meta-label">${label}</span>
                <span class="meta-value">${esc(value)}</span>
              </div>
            `)
            .join("");

          return `

            <div
              class="country-card"
              onclick="openCountry(${index})"
            >

              <div class="flag-container">
                ${
                  flag
                    ? `<img src="${esc(flag)}" alt="${esc(name)} flag">`
                    : ""
                }
              </div>

              <div class="country-content">

                <div class="country-name">
                  ${esc(name)}
                </div>

                <div class="country-meta">
                  ${rows}
                </div>

              </div>

            </div>

          `;

        }).join("");

    }


    /* ==========================================
       COUNTRY DETAILS
       (boxes and sections with no data are removed)
    ========================================== */

    function openCountry(index) {

      const c = visibleList[index];

      if (!c) {
        return;
      }

      const modal =
        document.getElementById("countryModal");

      const details =
        document.getElementById("countryDetails");


      /* ---- basic values ---- */

      const name = c.names?.common || "";
      const official = c.names?.official || "";

      const flag =
        c.flag?.url_png ||
        c.flag?.url_svg ||
        "";

      const capitals =
        (c.capitals || [])
          .map(x => x.name)
          .filter(Boolean);

      const alsoKnownAs =
        unique(c.names?.alternates || [])
          .map(esc)
          .join(", ");

      const nativeNames =
        unique(
          Object.values(c.names?.native || {})
            .map(n =>
              typeof n === "string"
                ? n
                : (n?.common || n?.official)
            )
        )
          .slice(0, 6)
          .map(esc)
          .join("<br>");

      const demonymRecord =
        c.demonyms?.eng ||
        Object.values(c.demonyms || {})[0] ||
        null;

      const demonym =
        demonymRecord
          ? (
              demonymRecord.f &&
              demonymRecord.f !== demonymRecord.m
                ? `${demonymRecord.m} / ${demonymRecord.f}`
                : (demonymRecord.m || "")
            )
          : "";


      /* ---- status ---- */

      const cl = c.classification || {};
      const status = [];

      if (cl.sovereign) {
        status.push("Sovereign state");
      }

      if (cl.dependency) {
        status.push(
          "Dependent territory" +
          (cl.dependency_type
            ? ` (${cl.dependency_type.replace(/_/g, " ")})`
            : "")
        );
      }

      if (cl.un_observer) {
        status.push("UN observer state");
      }

      if (cl.disputed) {
        status.push("Disputed recognition");
      }

      const parentCode = c.parent?.alpha_3;

      const parent =
        parentCode
          ? (
              countries.find(x => x.codes?.alpha_3 === parentCode)
                ?.names?.common || parentCode
            )
          : "";


      /* ---- geography ---- */

      const km = c.area?.kilometers;
      const mi = c.area?.miles;

      const area =
        km
          ? `${formatNumber(km)} km²` +
            (mi ? ` (${formatNumber(mi)} mi²)` : "")
          : "";

      const lat = c.coordinates?.lat;
      const lng = c.coordinates?.lng;

      const coordinates =
        (typeof lat === "number" && typeof lng === "number")
          ? `${lat.toFixed(2)}°, ${lng.toFixed(2)}°`
          : "";

      const borders =
        (c.borders || [])
          .map(code =>
            countries.find(x => x.codes?.alpha_3 === code)
              ?.names?.common || code
          )
          .map(esc)
          .join(", ");

      const landlocked =
        c.landlocked === true
          ? "Yes"
          : c.landlocked === false
            ? "No"
            : "";


      /* ---- everyday life ---- */

      const nf = c.number_format || {};

      const numberFormat =
        nf.decimal_separator
          ? `1${nf.thousands_separator || ""}234` +
            `${nf.thousands_separator || ""}567` +
            `${nf.decimal_separator}89`
          : "";

      const dt = c.date || {};

      const academicYear =
        monthDay(
          dt.academic_year_start?.month,
          dt.academic_year_start?.day
        );

      const fiscalYear =
        monthDay(
          dt.fiscal_year_start?.government?.month,
          dt.fiscal_year_start?.government?.day
        );


      /* ---- memberships ---- */

      const MEMBERSHIP_LABELS = {
        un: "United Nations",
        eu: "European Union",
        eurozone: "Eurozone",
        schengen: "Schengen Area",
        nato: "NATO",
        commonwealth: "Commonwealth of Nations",
        oecd: "OECD",
        g7: "G7",
        g20: "G20",
        brics: "BRICS",
        opec: "OPEC",
        african_union: "African Union",
        asean: "ASEAN",
        arab_league: "Arab League"
      };

      const memberships =
        Object.entries(MEMBERSHIP_LABELS)
          .filter(([key]) => c.memberships?.[key] === true)
          .map(([, label]) => label)
          .join(", ");


      /* ---- build the page ---- */

      const heroLine =
        [c.region, c.subregion]
          .filter(Boolean)
          .join(" · ");

      details.innerHTML = `

        <div class="detail-hero">

          ${
            flag
              ? `<img class="detail-flag" src="${esc(flag)}" alt="${esc(name)} flag">`
              : ""
          }

          <div>

            <h1 class="detail-name">${esc(name)}</h1>

            ${official ? `<p class="official-name">${esc(official)}</p>` : ""}

            ${heroLine ? `<p class="hero-line">${esc(heroLine)}</p>` : ""}

            ${
              c.flag?.description
                ? `<p class="flag-caption">${esc(c.flag.description)}</p>`
                : ""
            }

          </div>

        </div>

        ${section("Overview", [
          item("Native name", nativeNames),
          item("Also known as", alsoKnownAs),
          item("People are called", esc(demonym)),
          item("Capital", capitals.map(esc).join(", ")),
          item("Government type", esc(c.government_type || "")),
          item("Status", status.map(esc).join(", ")),
          item("Parent country", esc(parent))
        ])}

        ${section("Geography", [
          item("Continent", (c.continents || []).map(esc).join(", ")),
          item("Region", esc(c.region || "")),
          item("Subregion", esc(c.subregion || "")),
          item("Area", esc(area)),
          item("Location (center)", esc(coordinates)),
          item("Landlocked", landlocked),
          item("Borders", borders),
          item("Time zones", (c.timezones || []).map(esc).join(", "))
        ])}

        ${section("Codes", [
          item("ISO Alpha-2", esc(c.codes?.alpha_2 || "")),
          item("ISO Alpha-3", esc(c.codes?.alpha_3 || "")),
          item("ISO Numeric", esc(c.codes?.ccn3 || "")),
          item("FIPS", esc(c.codes?.fips || "")),
          item("GEC", esc(c.codes?.gec || "")),
          item("Olympic (IOC)", esc(c.codes?.cioc || "")),
          item("FIFA", esc(c.codes?.fifa || ""))
        ])}

        ${section("Communication & economy", [
          item("Currency", formatCurrencies(c.currencies)),
          item("Languages", formatLanguages(c.languages)),
          item(
            "Calling code",
            (c.calling_codes || []).map(x => esc("+" + x)).join(", ")
          ),
          item("Internet domain", (c.tlds || []).map(esc).join(", ")),
          item("Postal code format", esc(c.postal_code?.format || "")),
          item("Postal code regex", esc(c.postal_code?.regex || ""))
        ])}

        ${section("Everyday life", [
          item("Driving side", esc(cap(c.cars?.driving_side || ""))),
          item("Vehicle plate code", (c.cars?.signs || []).map(esc).join(", ")),
          item("Measurement system", esc(cap(c.units?.measurement_system || ""))),
          item("Temperature scale", esc(c.units?.temperature_scale || "")),
          item("Number format", esc(numberFormat)),
          item("Week starts on", esc(cap(dt.start_of_week || ""))),
          item("School year starts", esc(academicYear)),
          item("Government fiscal year starts", esc(fiscalYear))
        ])}

        ${section("Memberships", [
          item("Member of", esc(memberships))
        ])}

        ${section("Links", [
          item("Official website", link(c.links?.official, "Open ↗")),
          item("Wikipedia", link(c.links?.wikipedia, "Open ↗")),
          item("OpenStreetMap", link(c.links?.open_street_maps, "Open ↗")),
          item("Google Maps", link(c.links?.google_maps, "Open ↗"))
        ])}

      `;

      modal.classList.add("active");

    }


    /* ==========================================
       CURRENCY FORMATTER
    ========================================== */

    function formatCurrencies(currencies) {

      if (!currencies) {
        return "";
      }

      const entries =
        Array.isArray(currencies)
          ? currencies.map(cur => ["", cur])
          : Object.entries(currencies);

      return entries
        .map(([key, cur]) => {

          if (typeof cur === "string") {
            return esc(cur);
          }

          const name = cur?.name || "";

          const code =
            /^[A-Za-z]{3}$/.test(key)
              ? key
              : (
                  cur?.code ||
                  cur?.iso_code ||
                  cur?.iso ||
                  cur?.currency_code ||
                  ""
                );

          const symbol =
            cur?.symbol ? ` (${cur.symbol})` : "";

          const label =
            name
              ? name + (code ? ` — ${code}` : "")
              : code;

          return label ? esc(label + symbol) : "";

        })
        .filter(Boolean)
        .join("<br>");

    }


    /* ==========================================
       LANGUAGE FORMATTER
    ========================================== */

    function formatLanguages(languages) {

      if (!languages) {
        return "";
      }

      const names =
        Array.isArray(languages)
          ? languages.map(l => l?.name || l?.native_name || "")
          : Object.values(languages).map(l =>
              typeof l === "string" ? l : (l?.name || "")
            );

      return names
        .filter(Boolean)
        .map(esc)
        .join(", ");

    }


    /* ==========================================
       SEARCH
    ========================================== */

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        function () {

          const keyword =
            this.value
              .toLowerCase()
              .trim();


          const filtered =
            countries.filter(country => {

              const name =
                country.names?.common
                  ?.toLowerCase() || "";

              const official =
                country.names?.official
                  ?.toLowerCase() || "";

              const alpha2 =
                country.codes?.alpha_2
                  ?.toLowerCase() || "";

              const alpha3 =
                country.codes?.alpha_3
                  ?.toLowerCase() || "";


              return (
                name.includes(keyword) ||
                official.includes(keyword) ||
                alpha2.includes(keyword) ||
                alpha3.includes(keyword)
              );

            });


          document.getElementById(
            "countryCount"
          ).textContent =
            `${filtered.length} countries found`;


          renderCountries(filtered);

        }
      );


    /* ==========================================
       CLOSE MODAL
    ========================================== */

    function closeModal() {

      document
        .getElementById("countryModal")
        .classList.remove("active");

    }


    /* Close when clicking outside */

    document
      .getElementById("countryModal")
      .addEventListener(
        "click",
        function (event) {

          if (event.target === this) {
            closeModal();
          }

        }
      );


    /* ESC key */

    document.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Escape") {
          closeModal();
        }

      }
    );


    /* ==========================================
       START
    ========================================== */

    loadCountries();

  </script>

</body>
</html>
